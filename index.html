<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Switcher & Database</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #1f2d4a;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --user-bubble: #0284c7;
      --ai-bubble: #1e293b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* شريط الرأس وتوثيق الحساب */
    header {
      background: var(--card);
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .user-info img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent); }
    .btn-auth {
      background: var(--accent);
      color: #04121e;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-logout { background: #334155; color: #fff; }

    select {
      background: #090d16;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      width: 100%;
      outline: none;
    }

    #statusBadge {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    /* صندوق الشات */
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 88%; }
    .msg-wrapper.user { align-self: flex-start; }
    .msg-wrapper.ai { align-self: flex-end; }
    
    .msg {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user .msg { background: var(--user-bubble); color: #fff; border-bottom-left-radius: 2px; }
    .ai .msg { background: var(--ai-bubble); color: #f8fafc; border-bottom-right-radius: 2px; border: 1px solid var(--border); }
    .meta { font-size: 10px; color: #94a3b8; margin-bottom: 3px; }

    /* شريط الإدخال السفلي */
    footer {
      background: var(--card);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      background: #090d16;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      resize: none;
      height: 48px;
      font-size: 14px;
      outline: none;
    }
    button.send-btn {
      background: var(--accent);
      color: #04121e;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: bold;
      cursor: pointer;
    }
    img.generated-img { width: 100%; max-width: 320px; border-radius: 8px; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div id="authStatus" class="user-info">
        <span>سجّل الدخول لحفظ محادثاتك</span>
      </div>
      <button id="authBtn" class="btn-auth" onclick="handleAuth()">دخول Google</button>
    </div>

    <select id="modeSelect">
      <option value="coding">💻 نموذج الكودنق</option>
      <option value="chat">💬 الكلام العام</option>
      <option value="image">🎨 إنشاء الصور</option>
      <option value="study">📚 للدراسة والاعمال الثقيلة</option>
      <option value="unrestricted">🔓 غير مقيد</option>
    </select>

    <div id="statusBadge">
      <span id="modelIndicator">الوضع: تلقائي</span>
      <span id="syncIndicator">غيـر متصل</span>
    </div>
  </header>

  <div id="chatBox"></div>

  <footer>
    <textarea id="promptInput" placeholder="اكتب سؤالك، كودك، أو وصف الصورة..."></textarea>
    <button class="send-btn" id="sendBtn" onclick="handleSend()">إرسال</button>
  </footer>

  <script>
    // --- 1. إعدادات Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyCrK8LlZa3kDRRhj-45AMlOveTBDz8mmN0",
      authDomain: "soodye-9fc2a.firebaseapp.com",
      databaseURL: "https://soodye-9fc2a-default-rtdb.firebaseio.com",
      projectId: "soodye-9fc2a",
      storageBucket: "soodye-9fc2a.firebasestorage.app",
      messagingSenderId: "875395859795",
      appId: "1:875395859795:web:6b70e59fca9327077d4da6",
      measurementId: "G-K0J288S75G"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUser = null;
    let conversationHistory = [];

    // --- 2. إدارة التوثيق وقاعدة البيانات ---
    auth.onAuthStateChanged(user => {
      const authDiv = document.getElementById("authStatus");
      const authBtn = document.getElementById("authBtn");
      const sync = document.getElementById("syncIndicator");

      if (user) {
        currentUser = user;
        authDiv.innerHTML = `<img src="${user.photoURL || ''}" alt="User"> <span>${user.displayName || 'مستخدم'}</span>`;
        authBtn.innerText = "خروج";
        authBtn.className = "btn-auth btn-logout";
        sync.innerText = "🟢 متصل بقاعدتك";
        loadUserHistory(user.uid);
      } else {
        currentUser = null;
        authDiv.innerHTML = `<span>سجّل الدخول لحفظ محادثاتك</span>`;
        authBtn.innerText = "دخول Google";
        authBtn.className = "btn-auth";
        sync.innerText = "⚪ وضع زائر";
      }
    });

    function handleAuth() {
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => {
          console.error("Auth Error:", err);
          alert("خطأ بتسجيل الدخول: " + err.message);
        });
      }
    }

    function saveMessageToDb(role, content, modelName = "") {
      if (!currentUser) return;
      const ref = db.ref(`users/${currentUser.uid}/chats`).push();
      ref.set({
        role,
        content,
        modelName,
        timestamp: Date.now()
      });
    }

    function loadUserHistory(uid) {
      document.getElementById("chatBox").innerHTML = "";
      conversationHistory = [];
      db.ref(`users/${uid}/chats`).once("value", snapshot => {
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(item => {
            renderMessage(item.role, item.content, item.modelName);
            conversationHistory.push({ role: item.role, content: item.content });
          });
        }
      });
    }

    // --- 3. إعدادات الـ APIs وسلاسل التبديل التلقائي ---
    const KEYS = {
      GEMINI: "AQ.Ab8RN6I3H5_hURurGMgiH0FZfjWmLvV7bYry3KeYRLeTAT45Cw",
      GROQ: "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",
      COHERE: "qOEvHw98PdmpJRh2WqlGmsPfnB2oJOI5HjLeDTZp",
      CF_ACCOUNT: "fc9f24bcdb430c9c44f326d63d7e795f",
      CF_TOKEN: "cfat_1rnWVm95Eep5WJOwW9dZEfmFSqMWhnNV8TY8xpoq7c482ce1"
    };

    const MODES_CONFIG = {
      // 1. نموذج الكودنق
      coding: [
        { provider: "gemini", model: "gemini-2.5-flash", name: "Gemini 2.5 Flash" },
        { provider: "groq", model: "qwen/qwen3.6-27b", name: "Groq (Qwen 3.6 27B)" },
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B)" }
      ],
      // 2. الكلام العام
      chat: [
        { provider: "groq", model: "openai/gpt-oss-20b", name: "Groq (GPT-OSS 20B)" },
        { provider: "gemini", model: "gemini-2.5-flash-lite", name: "Gemini 2.5 Flash-Lite" },
        { provider: "llm7", model: "gpt-oss:20b", name: "LLM7 Zero-Key" }
      ],
      // 3. إنشاء الصور
      image: [
        { provider: "pollinations", model: "flux", name: "FLUX Direct Engine" },
        { provider: "cloudflare", model: "@cf/stabilityai/stable-diffusion-xl-base-1.0", name: "Cloudflare SDXL" }
      ],
      // 4. للدراسة والاعمال الثقيلة
      study: [
        { provider: "gemini", model: "gemini-2.5-flash", name: "Gemini 2.5 Flash (1M Context)" },
        { provider: "cohere", model: "command-r-plus", name: "Cohere Command R+" },
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B)" }
      ],
      // 5. غير مقيد
      unrestricted: [
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B المفتوح)" },
        { provider: "groq", model: "openai/gpt-oss-20b", name: "Groq (GPT-OSS 20B)" },
        { provider: "llm7", model: "mistral-Nemo-Instruct-2407", name: "LLM7 Nemo" }
      ]
    };

    // --- 4. محركات الاستدعاء المباشرة ---
    async function callGemini(item, history) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${item.model}:generateContent?key=${KEYS.GEMINI}`;
      const contents = history.map(msg => ({
        role: msg.role === "assistant" ? "model" : "user",
        parts: [{ text: msg.content }]
      }));
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents })
      });
      if (!res.ok) throw new Error(`Gemini status ${res.status}`);
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    async function callGroq(item, history) {
      const url = "https://api.groq.com/openai/v1/chat/completions";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${KEYS.GROQ}`
        },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) throw new Error(`Groq status ${res.status}`);
      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function callCohere(item, history) {
      const url = "https://api.cohere.com/v2/chat";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${KEYS.COHERE}`
        },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) throw new Error(`Cohere status ${res.status}`);
      const data = await res.json();
      return data.message.content[0].text;
    }

    async function callLLM7(item, history) {
      const url = "https://api.llm7.io/v1/chat/completions";
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) throw new Error(`LLM7 status ${res.status}`);
      const data = await res.json();
      return data.choices[0].message.content;
    }

    // --- 5. واجهة المستخدم والتحكم بالإرسال والتبديل ---
    function renderMessage(role, content, meta = "") {
      const chatBox = document.getElementById("chatBox");
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role}`;

      if (meta) {
        const metaSpan = document.createElement("span");
        metaSpan.className = "meta";
        metaSpan.innerText = meta;
        wrapper.appendChild(metaSpan);
      }

      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      msgDiv.innerHTML = content;
      wrapper.appendChild(msgDiv);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const input = document.getElementById("promptInput");
      const prompt = input.value.trim();
      if (!prompt) return;

      input.value = "";
      renderMessage("user", prompt);
      conversationHistory.push({ role: "user", content: prompt });
      saveMessageToDb("user", prompt);

      const mode = document.getElementById("modeSelect").value;
      const indicator = document.getElementById("modelIndicator");

      // نمط توليد الصور
      if (mode === "image") {
        indicator.innerText = "جاري الرسم...";
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=flux&width=768&height=768&nologo=true`;
        const imgHtml = `<img class="generated-img" src="${imgUrl}" alt="Generated Image" />`;
        renderMessage("ai", imgHtml, "FLUX Image Engine");
        saveMessageToDb("ai", imgHtml, "FLUX Image Engine");
        indicator.innerText = "اكتمل الرسم";
        return;
      }

      // مسار النصوص مع التبديل التلقائي والحفاظ على كامل السياق
      const chain = MODES_CONFIG[mode];
      let resolved = false;

      for (let i = 0; i < chain.length; i++) {
        const target = chain[i];
        try {
          indicator.innerText = `محاولة: ${target.name}...`;
          let reply = "";

          if (target.provider === "gemini") reply = await callGemini(target, conversationHistory);
          else if (target.provider === "groq") reply = await callGroq(target, conversationHistory);
          else if (target.provider === "cohere") reply = await callCohere(target, conversationHistory);
          else if (target.provider === "llm7") reply = await callLLM7(target, conversationHistory);

          renderMessage("ai", reply, target.name);
          conversationHistory.push({ role: "assistant", content: reply });
          saveMessageToDb("ai", reply, target.name);
          indicator.innerText = `متصل: ${target.name}`;
          resolved = true;
          break; // نجاح الاستجابة والتوقف عن التدوير

        } catch (err) {
          console.warn(`[Failover] تعذر الرد من ${target.name}:`, err.message);
          indicator.innerText = `فشل ${target.name}، الانتقال للتالي...`;
        }
      }

      if (!resolved) {
        renderMessage("ai", "⚠️ انتهت جميع الحصص المتاحة في هذا النمط، يرجى المحاولة لاحقاً أو التبديل لنمط آخر.", "النظام");
        indicator.innerText = "انتهت الحصص";
      }
    }
  </script>
</body>
</html>
