<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart AI Switcher & Database</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #1f2d4a;
      --text: #f1f5f9;
      --accent: #38bdf8;
      --user-bubble: #0284c7;
      --ai-bubble: #1e293b;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    header {
      background: var(--card);
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .user-info { display: flex; align-items: center; gap: 6px; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .user-info img { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); flex-shrink: 0; }
    
    .actions-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-action {
      background: var(--accent);
      color: #04121e;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-errors { background: #334155; color: #f8fafc; border: 1px solid var(--border); }
    .btn-logout { background: #475569; color: #fff; }

    select {
      background: #090d16;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      width: 100%;
      outline: none;
    }

    #statusBadge {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg-wrapper { display: flex; flex-direction: column; max-width: 90%; }
    .msg-wrapper.user { align-self: flex-start; }
    .msg-wrapper.ai { align-self: flex-end; }
    
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user .msg { background: var(--user-bubble); color: #fff; border-bottom-left-radius: 2px; }
    .ai .msg { background: var(--ai-bubble); color: #f8fafc; border-bottom-right-radius: 2px; border: 1px solid var(--border); }
    .meta { font-size: 10px; color: #94a3b8; margin-bottom: 3px; }

    footer {
      background: var(--card);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      align-items: center;
    }
    textarea {
      flex: 1;
      background: #090d16;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      resize: none;
      height: 42px;
      font-size: 14px;
      outline: none;
    }
    button.send-btn {
      background: var(--accent);
      color: #04121e;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      height: 42px;
      font-weight: bold;
      cursor: pointer;
    }
    img.generated-img { width: 100%; max-width: 280px; border-radius: 8px; margin-top: 6px; }

    /* نافذة الأخطاء المنبثقة */
    #errorsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 99;
      padding: 16px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      height: 70vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 12px;
      font-family: monospace;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .error-item {
      background: #090d16;
      padding: 8px;
      border-radius: 6px;
      border-right: 3px solid var(--danger);
    }
    .error-item.warn { border-right-color: var(--warning); }
    .close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div id="authStatus" class="user-info">
        <span>سجّل الدخول لحفظ محادثاتك</span>
      </div>
      <div class="actions-group">
        <button id="errorsBtn" class="btn-action btn-errors" onclick="toggleErrorsModal()">الأخطاء (0)</button>
        <button id="authBtn" class="btn-action" onclick="handleAuth()">دخول Google</button>
      </div>
    </div>

    <select id="modeSelect">
      <option value="coding">💻 نموذج الكودنق</option>
      <option value="chat">💬 الكلام العام</option>
      <option value="image">🎨 إنشاء الصور</option>
      <option value="study">📚 للدراسة والاعمال الثقيلة</option>
      <option value="unrestricted">🔓 غير مقيد</option>
    </select>

    <div id="statusBadge">
      <span id="modelIndicator">الوضع: جاهز</span>
      <span id="syncIndicator">⚪ غير متصل</span>
    </div>
  </header>

  <div id="chatBox"></div>

  <footer>
    <textarea id="promptInput" placeholder="اكتب سؤالك، كودك، أو وصف الصورة..."></textarea>
    <button class="send-btn" id="sendBtn" onclick="handleSend()">إرسال</button>
  </footer>

  <!-- نافذة عرض تفاصيل الأخطاء -->
  <div id="errorsModal">
    <div class="modal-content">
      <div class="modal-header">
        <strong>سجل تشخيص الأخطاء والتحويلات</strong>
        <button class="close-modal" onclick="toggleErrorsModal()">✕</button>
      </div>
      <div class="modal-body" id="errorsList">
        <div style="color: #64748b;">لا توجد أخطاء مسجلة حتى الآن.</div>
      </div>
    </div>
  </div>

  <script>
    // --- سجل تتبع الأخطاء ---
    let errorsLog = [];
    function recordLog(type, source, message, solution = "") {
      const time = new Date().toLocaleTimeString('ar-EG');
      errorsLog.unshift({ type, source, message, solution, time });
      document.getElementById("errorsBtn").innerText = `الأخطاء (${errorsLog.length})`;
      
      const list = document.getElementById("errorsList");
      list.innerHTML = errorsLog.map(err => `
        <div class="error-item ${err.type}">
          <div><strong>[${err.time}] [${err.source}]</strong></div>
          <div style="margin-top: 4px; color: #f87171;">الرسالة: ${err.message}</div>
          ${err.solution ? `<div style="margin-top: 4px; color: #38bdf8;">الإجراء: ${err.solution}</div>` : ''}
        </div>
      `).join('');
    }

    function toggleErrorsModal() {
      const modal = document.getElementById("errorsModal");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    // --- 1. إعدادات Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyCrK8LlZa3kDRRhj-45AMlOveTBDz8mmN0",
      authDomain: "soodye-9fc2a.firebaseapp.com",
      databaseURL: "https://soodye-9fc2a-default-rtdb.firebaseio.com",
      projectId: "soodye-9fc2a",
      storageBucket: "soodye-9fc2a.firebasestorage.app",
      messagingSenderId: "875395859795",
      appId: "1:875395859795:web:6b70e59fca9327077d4da6",
      measurementId: "G-K0J288S75G"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentUser = null;
    let conversationHistory = [];

    // معالجة نتيجة إعادة التوجيه لمتصفحات الجوال (Redirect Result)
    auth.getRedirectResult().then(result => {
      if (result && result.user) {
        recordLog("info", "تسجيل الدخول", "تم تسجيل الدخول بنجاح بعد التحويل");
      }
    }).catch(err => {
      recordLog("error", "فشل التحويل", err.message, "تأكد من تفعيل نطاق الموقع في Firebase Authentication Settings");
    });

    auth.onAuthStateChanged(user => {
      const authDiv = document.getElementById("authStatus");
      const authBtn = document.getElementById("authBtn");
      const sync = document.getElementById("syncIndicator");

      if (user) {
        currentUser = user;
        authDiv.innerHTML = `<img src="${user.photoURL || ''}" alt="User"> <span>${user.displayName || 'مستخدم'}</span>`;
        authBtn.innerText = "خروج";
        authBtn.className = "btn-action btn-logout";
        sync.innerText = "🟢 متصل";
        loadUserHistory(user.uid);
      } else {
        currentUser = null;
        authDiv.innerHTML = `<span>سجّل الدخول لحفظ محادثاتك</span>`;
        authBtn.innerText = "دخول Google";
        authBtn.className = "btn-action";
        sync.innerText = "⚪ غير متصل";
      }
    });

    function handleAuth() {
      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        // استخدام signInWithRedirect لضمان العمل على متصفحات الجوال
        auth.signInWithRedirect(provider).catch(err => {
          recordLog("error", "تسجيل الدخول", err.message, "تأكد من تفعيل Google في صفحة Firebase Console");
          alert("خطأ بتسجيل الدخول: " + err.message);
        });
      }
    }

    function saveMessageToDb(role, content, modelName = "") {
      if (!currentUser) return;
      try {
        const ref = db.ref(`users/${currentUser.uid}/chats`).push();
        ref.set({ role, content, modelName, timestamp: Date.now() });
      } catch (err) {
        recordLog("warn", "قاعدة البيانات", err.message, "فشل حفظ الرسالة في السيرفر");
      }
    }

    function loadUserHistory(uid) {
      document.getElementById("chatBox").innerHTML = "";
      conversationHistory = [];
      db.ref(`users/${uid}/chats`).once("value", snapshot => {
        const data = snapshot.val();
        if (data) {
          Object.values(data).forEach(item => {
            renderMessage(item.role, item.content, item.modelName);
            conversationHistory.push({ role: item.role, content: item.content });
          });
        }
      }).catch(err => {
        recordLog("error", "قاعدة البيانات", err.message, "تأكد من إذن القراءة في قواعد Realtime Database");
      });
    }

    // --- 2. إعدادات الـ APIs والمفاتيح ---
    const KEYS = {
      GEMINI: "AQ.Ab8RN6I3H5_hURurGMgiH0FZfjWmLvV7bYry3KeYRLeTAT45Cw",
      GROQ: "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",
      COHERE: "qOEvHw98PdmpJRh2WqlGmsPfnB2oJOI5HjLeDTZp"
    };

    const MODES_CONFIG = {
      coding: [
        { provider: "gemini", model: "gemini-2.5-flash", name: "Gemini 2.5 Flash" },
        { provider: "groq", model: "qwen/qwen3.6-27b", name: "Groq (Qwen 3.6 27B)" },
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B)" }
      ],
      chat: [
        { provider: "groq", model: "openai/gpt-oss-20b", name: "Groq (GPT-OSS 20B)" },
        { provider: "gemini", model: "gemini-2.5-flash-lite", name: "Gemini 2.5 Flash-Lite" },
        { provider: "llm7", model: "gpt-oss:20b", name: "LLM7 Zero-Key" }
      ],
      image: [
        { provider: "pollinations", model: "flux", name: "FLUX Direct Engine" }
      ],
      study: [
        { provider: "gemini", model: "gemini-2.5-flash", name: "Gemini 2.5 Flash (1M Context)" },
        { provider: "cohere", model: "command-r-plus", name: "Cohere Command R+" },
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B)" }
      ],
      unrestricted: [
        { provider: "groq", model: "openai/gpt-oss-120b", name: "Groq (GPT-OSS 120B المفتوح)" },
        { provider: "groq", model: "openai/gpt-oss-20b", name: "Groq (GPT-OSS 20B)" },
        { provider: "llm7", model: "mistral-Nemo-Instruct-2407", name: "LLM7 Nemo" }
      ]
    };

    // --- 3. استدعاءات الـ APIs المباشرة ---
    async function callGemini(item, history) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${item.model}:generateContent?key=${KEYS.GEMINI}`;
      const contents = history.map(msg => ({
        role: msg.role === "assistant" ? "model" : "user",
        parts: [{ text: msg.content }]
      }));
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`كود [${res.status}]: ${errText}`);
      }
      const data = await res.json();
      return data.candidates[0].content.parts[0].text;
    }

    async function callGroq(item, history) {
      const url = "https://api.groq.com/openai/v1/chat/completions";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${KEYS.GROQ}`
        },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`كود [${res.status}]: ${errText}`);
      }
      const data = await res.json();
      return data.choices[0].message.content;
    }

    async function callCohere(item, history) {
      const url = "https://api.cohere.com/v2/chat";
      const res = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${KEYS.COHERE}`
        },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`كود [${res.status}]: ${errText}`);
      }
      const data = await res.json();
      return data.message.content[0].text;
    }

    async function callLLM7(item, history) {
      const url = "https://api.llm7.io/v1/chat/completions";
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: item.model, messages: history })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`كود [${res.status}]: ${errText}`);
      }
      const data = await res.json();
      return data.choices[0].message.content;
    }

    // --- 4. التحكم بالشات والتحويل التلقائي ---
    function renderMessage(role, content, meta = "") {
      const chatBox = document.getElementById("chatBox");
      const wrapper = document.createElement("div");
      wrapper.className = `msg-wrapper ${role}`;

      if (meta) {
        const metaSpan = document.createElement("span");
        metaSpan.className = "meta";
        metaSpan.innerText = meta;
        wrapper.appendChild(metaSpan);
      }

      const msgDiv = document.createElement("div");
      msgDiv.className = "msg";
      msgDiv.innerHTML = content;
      wrapper.appendChild(msgDiv);

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const input = document.getElementById("promptInput");
      const prompt = input.value.trim();
      if (!prompt) return;

      input.value = "";
      renderMessage("user", prompt);
      conversationHistory.push({ role: "user", content: prompt });
      saveMessageToDb("user", prompt);

      const mode = document.getElementById("modeSelect").value;
      const indicator = document.getElementById("modelIndicator");

      if (mode === "image") {
        indicator.innerText = "جاري الرسم...";
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=flux&width=768&height=768&nologo=true`;
        const imgHtml = `<img class="generated-img" src="${imgUrl}" alt="Generated Image" />`;
        renderMessage("ai", imgHtml, "FLUX Image Engine");
        saveMessageToDb("ai", imgHtml, "FLUX Image Engine");
        indicator.innerText = "اكتمل الرسم";
        return;
      }

      const chain = MODES_CONFIG[mode];
      let resolved = false;

      for (let i = 0; i < chain.length; i++) {
        const target = chain[i];
        try {
          indicator.innerText = `محاولة: ${target.name}...`;
          let reply = "";

          if (target.provider === "gemini") reply = await callGemini(target, conversationHistory);
          else if (target.provider === "groq") reply = await callGroq(target, conversationHistory);
          else if (target.provider === "cohere") reply = await callCohere(target, conversationHistory);
          else if (target.provider === "llm7") reply = await callLLM7(target, conversationHistory);

          renderMessage("ai", reply, target.name);
          conversationHistory.push({ role: "assistant", content: reply });
          saveMessageToDb("ai", reply, target.name);
          indicator.innerText = `متصل: ${target.name}`;
          resolved = true;
          break;

        } catch (err) {
          recordLog("error", target.name, err.message, i < chain.length - 1 ? `تحويل تلقائي إلى [${chain[i+1].name}]` : "فشلت كل خيارات السلسلة");
          indicator.innerText = `فشل ${target.name}، جاري التبديل...`;
        }
      }

      if (!resolved) {
        renderMessage("ai", "⚠️ انتهت جميع الحصص أو فشلت الاتصالات في هذا النمط. اضغط على زر 'الأخطاء' لمعرفة السبب بدقة.", "النظام");
        indicator.innerText = "انتهت الخيارات";
      }
    }
  </script>
</body>
</html>
